<div class="container">
  <div class="row">
    <div class="col">
      <h1 class="d-none d-sm-block h3 mb-3 text-center" i18n>Holdings</h1>
    </div>
  </div>
  <div class="row">
    <div class="col-lg">
      <div class="d-flex">
        <gf-toggle
          class="d-none d-lg-block"
          [defaultValue]="holdingsViewMode"
          [isDisabled]="isHoldingsViewModeToggleDisabled"
          [options]="holdingsViewModeOptions"
          (valueChange)="onChangeHoldingsViewMode($event.value)"
        />
        <div class="align-items-center d-flex flex-grow-1 justify-content-end">
          <gf-toggle
            class="d-none d-lg-block"
            [defaultValue]="holdingType"
            [options]="holdingTypeOptions"
            (valueChange)="onChangeHoldingType($event.value)"
          />
        </div>
      </div>
      @if (holdingsViewMode === 'CHART') {
        <gf-treemap-chart
          class="mt-3"
          cursor="pointer"
          [baseCurrency]="user?.settings?.baseCurrency"
          [colorScheme]="user?.settings?.colorScheme"
          [dateRange]="user?.settings?.dateRange"
          [holdings]="holdings"
          [locale]="user?.settings?.locale"
          (treemapChartClicked)="onHoldingClicked($event)"
        />
      }
      <div [class.d-none]="holdingsViewMode !== 'TABLE'">
        <gf-holdings-table
          [holdings]="holdings"
          [locale]="user?.settings?.locale"
          (holdingClicked)="onHoldingClicked($event)"
        />
        @if (hasPermissionToCreateActivity && (holdings?.length ?? 0) > 0) {
          <div class="text-center">
            <a
              class="mt-3"
              i18n
              mat-stroked-button
              [routerLink]="routerLinkPortfolioActivities"
              >Manage Activities</a
            >
          </div>
        }
      </div>
    </div>
  </div>
</div>
