<div class="container p-0">
  <div class="no-gutters row">
    <div class="status-container text-muted text-right">
      @if ((errors()?.length ?? 0) > 0 && !isLoading()) {
        <ion-icon
          i18n-title
          name="time-outline"
          title="Oops! A data provider is experiencing the hiccups."
          (click)="onShowErrors()"
        />
      }
    </div>
    @if (isLoading()) {
      <div class="align-items-center d-flex">
        <ngx-skeleton-loader
          animation="pulse"
          class="mb-2"
          [theme]="{
            height: '4rem',
            width: '15rem'
          }"
        />
      </div>
    }
    <div
      class="display-4 font-weight-bold m-0 text-center value-container"
      [hidden]="isLoading()"
    >
      <span #value id="value"></span>
    </div>
    <div class="currency-container flex-grow-1 px-1">
      {{ unit() }}
    </div>
  </div>
  @if (showDetails()) {
    <div class="row">
      <div class="d-flex col justify-content-end">
        @if (isLoading() || change() !== undefined) {
          <gf-value
            [colorizeSign]="true"
            [isCurrency]="true"
            [isLoading]="isLoading()"
            [locale]="locale()"
            [value]="change()"
          />
        }
      </div>
      <div class="col">
        <!--
          A relative change is not defined for a date range starting at a net
          worth of 0, in which case the value is omitted rather than rendered
          as a loading state
        -->
        @if (isLoading() || changeInPercentage() !== undefined) {
          <gf-value
            [colorizeSign]="true"
            [isLoading]="isLoading()"
            [isPercent]="true"
            [locale]="locale()"
            [value]="changeInPercentage()"
          />
        }
      </div>
    </div>
  }
</div>
