@if (countryCodeOfSelectedCurrency) {
  <gf-entity-logo
    class="flex-shrink-0 mr-1"
    [countryCode]="countryCodeOfSelectedCurrency"
  />
}

<input
  autocapitalize="off"
  autocomplete="off"
  matInput
  [formControl]="control"
  [matAutocomplete]="currencyAutocomplete"
  [matAutocompleteConnectedTo]="autocompleteOrigin"
/>

<mat-autocomplete
  #currencyAutocomplete="matAutocomplete"
  (closed)="onPanelClosed()"
  (optionSelected)="onUpdateCurrency($event)"
>
  @for (currency of filteredCurrencies; track currency) {
    <mat-option class="line-height-1" [value]="currency">
      <span class="align-items-center d-flex">
        <gf-entity-logo
          class="mr-1"
          [countryCode]="getCountryCodeFromCurrency(currency)"
          [hasPlaceholder]="true"
        />
        <span>{{ currency }}</span>
      </span>
    </mat-option>
  }
</mat-autocomplete>
