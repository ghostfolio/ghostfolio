<mat-radio-group
  class="d-inline-flex text-nowrap"
  [formControl]="optionFormControl"
  (change)="onValueChange()"
>
  @for (option of options(); track option) {
    <mat-radio-button
      class="d-inline-flex"
      [class]="{
        'cursor-default': option.value === optionFormControl.value,
        'cursor-pointer':
          !isDisabled() &&
          !isLoading() &&
          option.value !== optionFormControl.value
      }"
      [disabled]="isDisabled() || isLoading()"
      [title]="option.title ?? ''"
      [value]="option.value"
    >
      @if (option.iconName) {
        <ion-icon class="d-block" [name]="option.iconName" />
      } @else {
        <span>{{ option.label }}</span>
      }
    </mat-radio-button>
  }
</mat-radio-group>
